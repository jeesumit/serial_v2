<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serial Monitor</title><style>
:root{--bg:#f4f5f7;--cd:#fff;--tx:#1c2025;--mu:#6b7480;--bd:#d8dce2;--ac:#2563eb;--rx:#0f766e;--txc:#b45309;--sy:#7c3aed;--er:#dc2626;--ok:#16a34a;--sh:0 2px 10px #0002;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1216;--cd:#171b21;--tx:#e5e8ec;--mu:#8f99a6;--bd:#2b323b;--ac:#6ea0ff;--rx:#4fd1c5;--txc:#fbbf24;--sy:#b79cff;--er:#f87171;--ok:#4ade80;--sh:0 2px 14px #0008;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1216;--cd:#171b21;--tx:#e5e8ec;--mu:#8f99a6;--bd:#2b323b;--ac:#6ea0ff;--rx:#4fd1c5;--txc:#fbbf24;--sy:#b79cff;--er:#f87171;--ok:#4ade80;--sh:0 2px 14px #0008;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
select,input,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 9px}
button{cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s}button:hover:not(:disabled){border-color:var(--ac)}button:disabled,select:disabled,input:disabled{opacity:.5;cursor:not-allowed}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
header{background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:10px}.top h1{font-size:16px;margin:0}.sp{flex:1}
#conn{font-weight:600;color:#fff;background:var(--ok);border-color:var(--ok);padding:6px 14px}#conn.d{background:var(--er);border-color:var(--er)}#conn svg{width:18px;height:18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--ok);box-shadow:0 0 0 3px #16a34a33}
.cfg{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}.g{display:flex;flex-direction:column;gap:3px}.lbl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}.wb{display:flex;gap:4px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;background:var(--bg)}.seg button.on{background:var(--ac)}
.baud{position:relative;display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;background:var(--bg);overflow:visible}
.baud>button{border:0;border-radius:0;padding:6px 10px;font-weight:700}.baud .pill{flex-direction:column;gap:0;align-items:center;min-width:104px;line-height:1.1;padding:3px 8px}
.pill b{font:700 17px ui-monospace,monospace}.pill small{color:var(--mu);font-size:10px;text-transform:uppercase}
#bpop{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--cd);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:10px;width:270px}
#chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}#chips button{justify-content:center;padding:5px 0;font:13px ui-monospace,monospace}
.sw{display:inline-flex;align-items:center;gap:6px;height:32px;cursor:pointer}
#pinfo{padding:5px 14px;font-size:12px;color:var(--mu);background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:16px;flex-wrap:wrap}#pinfo b{color:var(--tx);font-family:ui-monospace,monospace}
.bar{padding:6px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--bd)}.q{display:flex;gap:4px;flex-wrap:wrap}.q button{padding:2px 8px;border-radius:99px;font-size:12px}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#plot{flex:0 0 46%;min-height:150px;background:var(--cd);display:flex;flex-direction:column}
#pt{padding:5px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}#leg{display:flex;gap:12px;flex-wrap:wrap}#leg label{display:inline-flex;gap:4px;align-items:center;cursor:pointer;font-family:ui-monospace,monospace}
#cvw{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block;cursor:crosshair}
#spl{height:7px;cursor:row-resize;background:var(--bd);opacity:.5}#spl:hover{opacity:1;background:var(--ac)}
#wrap{flex:1;overflow:auto;background:var(--cd);min-height:60px}table{width:100%;border-collapse:collapse;font:13px ui-monospace,Menlo,Consolas,monospace}
th{position:sticky;top:0;background:var(--cd);text-align:left;color:var(--mu);padding:5px 10px;border-bottom:1px solid var(--bd)}td{padding:2px 10px;white-space:pre-wrap;word-break:break-all}
tr{cursor:pointer}tr:hover td{background:var(--bg)}tr.sel td{background:#2563eb33}.RX td:nth-child(4){color:var(--rx)}.TX td:nth-child(4){color:var(--txc)}.SYS td{color:var(--sy)}.mu{color:var(--mu)}
body.o-print #plot,body.o-print #spl{display:none}body.o-plot #wrap,body.o-plot #spl{display:none}body.o-plot #plot{flex:1}
footer{padding:5px 14px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);display:flex;gap:14px;flex-wrap:wrap}
#hb{display:none;background:var(--sy);color:#fff;padding:5px 14px;align-items:center;gap:10px}#hb button{padding:1px 8px}
#toast{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:50}#toast div{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:8px;padding:8px 12px;box-shadow:var(--sh)}#toast .e{border-left-color:var(--er)}
.badge{background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;box-shadow:0 0 0 1px var(--bd)}.badge img{height:30px;display:block}
#pgc{display:inline-flex;align-items:center;gap:6px;margin-left:auto}#ptl{display:none}
@media print{header,.bar,#pinfo,#spl,footer,#toast,#hb{display:none!important}body{height:auto;overflow:visible;display:block;background:#fff;color:#000}main{display:block}
#ptl{display:block;font:12px system-ui;padding:0 0 8px}#plot{display:flex;height:340px;flex:none!important;border-bottom:1px solid #ccc}#wrap{overflow:visible;height:auto}th{position:static}tr{cursor:auto}
body.o-print #plot{display:none}body.o-plot #wrap{display:none}}
</style></head><body class="o-both">

function row(r){const t=document.createElement('tr');t.className=r.dir;t.dataset.t=r.t;[r.seq,r.ts,r.delta.toFixed(3),r.dir,r.text].forEach(v=>{const d=document.createElement('td');d.textContent=v;t.appendChild(d)});const f=$('#flt').value.toLowerCase();if(f&&!r.text.toLowerCase().includes(f))t.hidden=true;return t}

const RXR=/([A-Za-z_]\w*)\s*[=:]\s*(-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?)/g,NUM=/-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?/g;

function push(k,t,v){if(!isFinite(v))return;let c=ch[k];if(!c){c=ch[k]={k,t:[],v:[],hide:false,col:COL[order.length%8]};order.push(k);const l=document.createElement('label');l.style.color=c.col;l.innerHTML=`<input type="checkbox" checked>${esc(k)} <b></b>`;l.firstChild.onchange=e=>{c.hide=!e.target.checked;sched()};c.el=l.lastChild;$('#leg').appendChild(l)}
c.t.push(t);c.v.push(v);if(c.t.length>CAP*1.5){c.t.splice(0,CAP/2);c.v.splice(0,CAP/2)}}
function feed(r){if(r.dir!=='RX'||mode==='hex'||r.text.includes('[partial]'))return;if(T0===null)T0=r.t;const rel=r.t-T0;let m,g=0;RXR.lastIndex=0;

function clearPlot(){ch=Object.create(null);order=[];$('#leg').innerHTML='';T0=null;lastT=0;mark=null;sched()}

const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H2);const cs=getComputedStyle(document.body),mu=cs.getPropertyValue('--mu'),gr=cs.getPropertyValue('--bd'),cd=cs.getPropertyValue('--cd'),tx=cs.getPropertyValue('--tx');
const w=+$('#win').value;let a,b;if(view.f){if(w){b=Math.max(lastT,w);a=b-w}else{a=0;b=Math.max(lastT,1)}}else{a=view.a;b=view.b}cur={a,b};
$('#fol').className=view.f?'on':'';const pw=W-L-Rm,ph=H2-Tp-Bm;let lo=Infinity,hi=-Infinity;const vis=order.map(k=>ch[k]).filter(c=>!c.hide);
vis.forEach(c=>{c.i0=Math.max(0,bsr(c.t,a)-1);c.i1=Math.min(c.t.length,bsr(c.t,b)+1);c.lo=Infinity;c.hi=-Infinity;for(let i=c.i0;i<c.i1;i++){const v=c.v[i];if(v<c.lo)c.lo=v;if(v>c.hi)c.hi=v}if(c.lo<lo)lo=c.lo;if(c.hi>hi)hi=c.hi});
order.forEach(k=>{const c=ch[k],l=c.v.length?c.v[c.v.length-1]:'';c.el.textContent=fm(l)+(c.lo<Infinity?` [${fm(c.lo)}…${fm(c.hi)}]`:'')});
x.font='11px system-ui';x.fillStyle=mu;if(lo===Infinity){x.fillText('waiting for numeric data…',L+10,Tp+20);return}if(lo===hi){lo-=1;hi+=1}const pad=(hi-lo)*.07;lo-=pad;hi+=pad;
const X=t=>L+(t-a)/(b-a)*pw,Y=v=>Tp+ph-(v-lo)/(hi-lo)*ph;x.strokeStyle=gr;x.lineWidth=1;x.textAlign='right';
for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);x.beginPath();x.moveTo(L,y);x.lineTo(W-Rm,y);x.stroke();x.fillText(fm(v),L-6,y+4)}
x.textAlign='center';for(let i=0;i<=5;i++){const t=a+(b-a)*i/5,px=X(t);x.beginPath();x.moveTo(px,Tp);x.lineTo(px,Tp+ph);x.stroke();x.fillText(t.toFixed(1)+'s',px,H2-6)}

vis.forEach(c=>{x.strokeStyle=c.col;x.beginPath();const cnt=c.i1-c.i0;if(cnt<=pw*2){for(let i=c.i0;i<c.i1;i++){const px=X(c.t[i]),py=Y(c.v[i]);i===c.i0?x.moveTo(px,py):x.lineTo(px,py)}}
else{let lc=null,mn=0,mxv=0,first=true;const fl=()=>{if(lc===null)return;first?x.moveTo(lc,Y(mn)):x.lineTo(lc,Y(mn));x.lineTo(lc,Y(mxv));first=false};
for(let i=c.i0;i<c.i1;i++){const col=Math.floor(X(c.t[i])),v=c.v[i];if(col!==lc){fl();lc=col;mn=mxv=v}else{if(v<mn)mn=v;if(v>mxv)mxv=v}}fl()}x.stroke()});

if(mark!==null&&mark>=a&&mark<=b){x.fillStyle='#d97706';x.textAlign='left';x.fillText('◆ '+mark.toFixed(2)+'s',X(mark)+4,Tp+12)}
if(mx!==null&&mx>=L&&mx<=W-Rm){const tt=a+(mx-L)/pw*(b-a);x.strokeStyle=mu;x.beginPath();x.moveTo(mx,Tp);x.lineTo(mx,Tp+ph);x.stroke();
const lines=[`t = ${tt.toFixed(2)} s`];vis.forEach(c=>{let i=bsr(c.t,tt);if(i>0&&(i>=c.t.length||tt-c.t[i-1]<c.t[i]-tt))i--;if(c.t.length){lines.push([c.col,`${c.k}: ${fm(c.v[i])}`]);x.fillStyle=c.col;x.beginPath();x.arc(X(c.t[i]),Y(c.v[i]),3.5,0,7);x.fill()}});
const bw=130,bh=8+lines.length*15,bx=mx+14+bw>W?mx-bw-14:mx+14;x.fillStyle=cd;x.strokeStyle=gr;x.beginPath();x.rect(bx,Tp+4,bw,bh);x.fill();x.stroke();x.textAlign='left';
lines.forEach((l,i)=>{x.fillStyle=Array.isArray(l)?l[0]:tx;x.fillText(Array.isArray(l)?l[1]:l,bx+8,Tp+19+i*15)})}}
const cv=$('#cv');cv.onmousemove=e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;if(drag){const pw=r.width-L-Rm,dt=(e.clientX-drag.x)/pw*(drag.b-drag.a);view={f:0,a:drag.a-dt,b:drag.b-dt}}sched()};

cv.ondblclick=()=>{view.f=1;sched()};$('#fol').onclick=()=>{view.f=1;sched()};$('#win').onchange=()=>{view.f=1;sched()};$('#cp').onclick=clearPlot;addEventListener('resize',sched);
$('#tb').onclick=e=>{const tr=e.target.closest('tr');if(!tr||T0===null)return;document.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');mark=+tr.dataset.t-T0;

/* ---------- output mode, split, theme ---------- */
function setOut(o){const prev=out;out=o;document.body.className='o-'+o;if(o==='plot')$('#plot').style.flex='';document.querySelectorAll('#out button').forEach(b=>b.className=b.dataset.o===o?'on':'');

$('#spl').onmousedown=e=>{const m=$('main').getBoundingClientRect(),mv=ev=>{$('#plot').style.flex='0 0 '+Math.max(110,Math.min(m.height-90,ev.clientY-m.top))+'px';sched()},up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up);e.preventDefault()};
$('#th').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(document.body).colorScheme==='dark';d.dataset.theme=dark?'light':'dark';sched()};
/* ---------- connection, send, controls ---------- */
const PLUG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0zM12 17v5"/>';let busy=false;
async function status(){if(busy)return;busy=true;try{const s=await api('/api/status');if(s.error){if(!window._e){window._e=1;toast(s.error,1)}return}connected=s.connected;if(s.cfg.mode)mode=s.cfg.mode;$('#dot').className='dot'+(s.connected?' on':'');
$('#st').textContent=s.connected?`${s.cfg.port} @ ${s.cfg.baud} ${s.cfg.frame}`:(s.err||'disconnected');
$('#conn').className=s.connected?'d':'';$('#conn').innerHTML=s.connected?PLUG+'<path d="M3 3l18 18"/></svg> Disconnect':PLUG+'</svg> Connect';
['port','mode','fmt','split','ldir','lset','dbits','par','sb','bm','bp','bv','ref'].forEach(i=>$('#'+i).disabled=s.connected);$('#by').textContent=s.bytes+' bytes';if(!$('#ldir').dataset.d){$('#ldir').value=s.logdir;$('#ldir').dataset.d=1}if(s.warn&&!window._w){window._w=1;toast(s.warn,1)}if(s.lost)$('#sk').textContent='⚠ '+s.lost+' records could not be written to disk: '+s.sinkerr;$('#lp').textContent=s.logpath?'file → '+s.logpath+(s.cfg.split?` · part ${s.part}, new file every ${s.cfg.split} min`:''):'';
$('#rate').textContent=(n-lastN)+'/s';lastN=n;if(s.sinkerr)$('#sk').textContent='storage: '+s.sinkerr;else if(s.dropped)$('#sk').textContent='storage dropped '+s.dropped+' records'}finally{busy=false}}

//PARSERS-START
const p2=(n,l=2)=>String(n).padStart(l,'0');
const fmtTs=t=>{const d=new Date(t*1000);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}.${p2(d.getMilliseconds(),3)}`};
const tsToT=s=>{const t=Date.parse(String(s).replace(' ','T'));return isNaN(t)?null:t/1000};
function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>!(r.length===1&&r[0]===''))}
function recsFromCSV(text){const rows=parseCSV(text);if(!rows.length)return[];const h=rows[0].map(x=>x.trim().toLowerCase());
if(h[0]==='seq'&&h.length>=5)return rows.slice(1).map((r,i)=>({seq:+r[0]||i+1,ts:r[1],t:tsToT(r[1])??i,delta:Number(r[2])||0,dir:r[3]||'RX',text:r.slice(4).join(',')}));
const tc=/^(t|time|timestamp|sec|seconds|ms)$/.test(h[0])&&rows.length>1&&isFinite(+rows[1][0])?0:-1,sc=h[0]==='ms'?1000:1;
return rows.slice(1).map((r,i)=>({seq:i+1,ts:r[0]||'',t:tc===0?+r[0]/sc:i,delta:0,dir:'RX',text:r.map((v,j)=>j===tc||v.trim()===''||!isFinite(+v)?null:(rows[0][j]||'c'+j).trim()+'='+v.trim()).filter(Boolean).join(',')||r.join(',')}))}
function recsFromJSON(text){let a=JSON.parse(text);if(!Array.isArray(a))a=a.records||a.r||[a];return a.map((o,i)=>({seq:o.seq??i+1,t:o.t??tsToT(o.ts)??i,ts:o.ts||'',delta:Number(o.delta)||0,dir:o.dir||'RX',text:String(o.text??o.data??Object.entries(o).filter(([k,v])=>typeof v==='number').map(([k,v])=>k+'='+v).join(','))}))}
function recsFromTXT(text){const re=/^#(\d+)\s+(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d\.\d+)\s+\+([\d.]+)s\s+(\w+)\s*\|\s?(.*)$/;return text.split(/\r?\n/).filter(l=>l.length).map((l,i)=>{const m=re.exec(l);return m?{seq:+m[1],ts:m[2],t:tsToT(m[2]),delta:+m[3],dir:m[4],text:m[5]}:{seq:i+1,ts:'',t:i,delta:0,dir:'RX',text:l}})}
function recsFromBIN(buf){const v=new DataView(buf),u=new Uint8Array(buf);if(![83,76,71,49,1].every((b,i)=>u[i]===b))throw new Error('not a Serial Monitor .bin log');let o=5,i=0;const out=[];
while(o+15<=buf.byteLength){const t=v.getFloat64(o,true),d=v.getUint32(o+8,true),dr=v.getUint8(o+12),ln=v.getUint16(o+13,true);o+=15;let s='';for(let k=o;k<o+ln&&k<u.length;k++){const c=u[k];s+=c>=32&&c<127?String.fromCharCode(c):'\\x'+p2(c.toString(16).toUpperCase())}o+=ln;out.push({seq:++i,t,ts:fmtTs(t),delta:d/1e6,dir:['RX','TX','SYS'][dr]||'RX',text:s})}return out}
//PARSERS-END
let FV=[],FVf=[],fp=0,fileMode=false,ft;const PAGE=1000;
function leaveFile(){fileMode=false;CAP=50000;FV=[];FVf=[];$('#hb').style.display='none'}
function fvFilter(){const f=$('#flt').value.toLowerCase();FVf=f?FV.filter(r=>r.text.toLowerCase().includes(f)):FV;fp=Math.min(fp,Math.max(0,Math.ceil(FVf.length/PAGE)-1));fvShow()}
function fvShow(){const tb=$('#tb');tb.innerHTML='';const fr=document.createDocumentFragment();FVf.slice(fp*PAGE,(fp+1)*PAGE).forEach(r=>fr.appendChild(row(r)));tb.appendChild(fr);
$('#pg').textContent=`${(FVf.length?fp*PAGE+1:0).toLocaleString()}–${Math.min(FVf.length,(fp+1)*PAGE).toLocaleString()} of ${FVf.length.toLocaleString()}`;$('#wrap').scrollTop=0;$('#cnt').textContent=FV.length.toLocaleString()+' records'}
async function openFiles(files){files=[...files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));const all=[];
try{for(const f of files){const ext=f.name.split('.').pop().toLowerCase();let r;if(ext==='bin')r=recsFromBIN(await f.arrayBuffer());else{const tx=await f.text();r=ext==='json'?recsFromJSON(tx):ext==='csv'?recsFromCSV(tx):recsFromTXT(tx)}for(const x of r)all.push(x)}}catch(e){return toast('Cannot read '+(files.length>1?'files':files[0].name)+': '+e.message,1)}
if(!all.length)return toast('No records found in the file',1);if(files.length>1){all.sort((a,b)=>a.t-b.t);all.forEach((r,i)=>r.seq=i+1)}
if(es){es.close();es=null}resetView();fileMode=true;CAP=5e6;mode='text';FV=all;fp=0;if(out!=='print')FV.forEach(feed);fvFilter();view={f:0,a:0,b:Math.max(lastT,1)};
$('#ht').textContent=`📄 ${files.length>1?files.length+' files':files[0].name} · ${all.length.toLocaleString()} records`;$('#hb').style.display='flex';sched();toast('Opened '+all.length.toLocaleString()+' records')}
$('#pp').onclick=()=>{if(fp>0){fp--;fvShow()}};$('#pn').onclick=()=>{if((fp+1)*PAGE<FVf.length){fp++;fvShow()}};$('#live').onclick=()=>{leaveFile();resetView();stream();view.f=1};
$('#openf').onclick=()=>$('#fin').click();$('#fin').onchange=e=>{if(e.target.files.length)openFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)openFiles(e.dataTransfer.files)});
$('#prt').onclick=()=>window.print();
let _th;addEventListener('beforeprint',()=>{const d=document.documentElement;_th=d.dataset.theme;d.dataset.theme='light';$('#ptl').textContent='Serial Monitor — '+($('#hb').style.display==='flex'?$('#ht').textContent:$('#st').textContent)+' — printed '+new Date().toLocaleString();draw()});
addEventListener('afterprint',()=>{const d=document.documentElement;_th?d.dataset.theme=_th:delete d.dataset.theme;draw()});
$('#logs').onclick=async()=>{const r=await api('/api/open-folder',{});if(r.error)toast(r.error,1)};
const setDir=async()=>{const r=await api('/api/logdir',{path:$('#ldir').value.trim()});r.error?toast(r.error,1):toast('Log folder set')};$('#lset').onclick=setDir;$('#ldir').onkeydown=e=>{if(e.key==='Enter')setDir()};
/* ---------- init ---------- */
setBaud(115200);ports().then(()=>{stream();status()});setInterval(status,1000);setInterval(()=>{if(!connected)ports()},4000);
</script></body></html>
